<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Connexion Dashboard — KAIDO-MD</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font-family: Inter, system-ui, sans-serif; background: radial-gradient(circle at top, #312e81, #111827 56%); color: #f8fafc; }
    .card { width: min(420px, 100%); padding: 32px; border: 1px solid rgba(255,255,255,.12); border-radius: 22px; background: rgba(15,23,42,.88); box-shadow: 0 24px 80px rgba(0,0,0,.45); backdrop-filter: blur(14px); }
    .logo { font-size: 48px; text-align: center; }
    h1 { margin: 10px 0 8px; text-align: center; font-size: 25px; }
    p { margin: 0 0 24px; text-align: center; color: #a5b4fc; }
    label { display: block; margin-bottom: 8px; font-weight: 700; }
    input { width: 100%; padding: 14px 15px; border: 1px solid #475569; border-radius: 12px; background: #0f172a; color: white; font-size: 16px; outline: none; }
    input:focus { border-color: #818cf8; box-shadow: 0 0 0 3px rgba(129,140,248,.2); }
    button { width: 100%; margin-top: 16px; padding: 14px; border: 0; border-radius: 12px; color: white; background: linear-gradient(135deg, #6366f1, #8b5cf6); font-size: 16px; font-weight: 800; cursor: pointer; }
    button:disabled { opacity: .65; cursor: wait; }
    .error { display: none; margin: 16px 0 0; padding: 12px; border-radius: 10px; color: #fecaca; background: rgba(127,29,29,.55); text-align: center; }
    .hint { margin-top: 18px; font-size: 12px; color: #94a3b8; text-align: center; }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">🐉</div>
    <h1>Dashboard KAIDO-MD</h1>
    <p>Saisissez uniquement le mot de passe administrateur.</p>
    <form id="loginForm" autocomplete="on">
      <label for="password">Mot de passe</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <button id="submitButton" type="submit">Se connecter</button>
      <div id="error" class="error" role="alert"></div>
    </form>
    <div class="hint">Le mot de passe est lu depuis <code>ADMIN_PASS</code> dans l’environnement du serveur.</div>
  </main>
  <script>
    const form = document.getElementById('loginForm');
    const errorBox = document.getElementById('error');
    const button = document.getElementById('submitButton');
    const params = new URLSearchParams(location.search);
    const returnTo = params.get('returnTo') || '/dashboard';

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      errorBox.style.display = 'none';
      button.disabled = true;
      try {
        const response = await fetch('/dashboard/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: form.password.value, returnTo })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Connexion refusée.');
        location.replace(data.redirect || '/dashboard');
      } catch (error) {
        errorBox.textContent = error.message;
        errorBox.style.display = 'block';
        form.password.select();
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
