<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Admins - KAIDO-MD</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 10px;
        }
        h1 {
            color: #667eea;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.8rem;
        }
        .back-link {
            display: inline-block;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }
        .back-link:hover { text-decoration: underline; }
        .btn-add {
            background: #28a745;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background 0.3s;
        }
        .btn-add:hover { background: #218838; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1.5rem;
        }
        th, td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        th {
            background: #f8f9fa;
            color: #667eea;
            font-weight: 600;
        }
        tr:hover { background: #fdfdfd; }
        .btn-delete {
            background: #dc3545;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-delete:hover { background: #c82333; }
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #888;
            font-size: 1.1rem;
        }
        .message {
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
        }
        .message.success { background: #d4edda; color: #155724; display: block; }
        .message.error { background: #f8d7da; color: #721c24; display: block; }
    </style>
</head>
<body>
    <div class="container">
        <a href="/dashboard" class="back-link"><i class="fa-solid fa-arrow-left"></i> Retour au tableau de bord</a>
        
        <div class="header-bar" style="margin-top: 1rem;">
            <h1><i class="fa-solid fa-user-shield"></i> Administrateurs du Bot</h1>
            <a href="admin-add.html" class="btn-add"><i class="fa-solid fa-plus"></i> Ajouter un Admin</a>
        </div>

        <div id="statusMessage" class="message"></div>

        <div id="tableContainer">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>JID / Numéro</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="adminsBody">
                    <tr><td colspan="3" style="text-align:center;">Chargement des administrateurs...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        async function loadAdmins() {
            const tbody = document.getElementById('adminsBody');
            try {
                const res = await fetch('/api/admins');
                const data = await res.json();
                const list = data.list || data.admins || [];

                if (!list.length) {
                    tbody.innerHTML = '<tr><td colspan="3" class="empty-state">📭 Aucun administrateur enregistré</td></tr>';
                    return;
                }

                tbody.innerHTML = '';
                list.forEach((admin, index) => {
                    const jid = typeof admin === 'string' ? admin : (admin.jid || admin.number);
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><strong>${index + 1}</strong></td>
                        <td><code>${jid}</code></td>
                        <td>
                            <button class="btn-delete" onclick="removeAdmin('${jid}')">
                                <i class="fa-solid fa-trash"></i> Supprimer
                            </button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="3" style="color:red; text-align:center;">Erreur: ${err.message}</td></tr>`;
            }
        }

        async function removeAdmin(jid) {
            if (!confirm(`Voulez-vous vraiment supprimer l'admin ${jid} ?`)) return;

            const msgDiv = document.getElementById('statusMessage');
            try {
                const res = await fetch('/admin/remove', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ jid })
                });
                const data = await res.json();
                if (res.ok) {
                    msgDiv.className = 'message success';
                    msgDiv.textContent = `✅ Admin ${jid} supprimé avec succès.`;
                    loadAdmins();
                } else {
                    msgDiv.className = 'message error';
                    msgDiv.textContent = `❌ Erreur: ${data.error || 'Échec de la suppression'}`;
                }
            } catch (err) {
                msgDiv.className = 'message error';
                msgDiv.textContent = `❌ Erreur: ${err.message}`;
            }
        }

        loadAdmins();
    </script>
</body>
</html>
